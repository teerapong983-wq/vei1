<style>
  html,body{margin:0;height:100%;background:#F5F7F4;font-family:Sarabun,"Noto Sans Thai",system-ui,sans-serif;color:#17261F;overflow:hidden}
  #app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#F5F7F4}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F5F7F4;transition:opacity .3s}
  #load img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 18px rgba(15,110,86,.3)}
  #load .t{font-size:15px;color:#54655D}
  .spin{width:26px;height:26px;border:3px solid #DCE3DE;border-top-color:#0F6E56;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #slow{display:none;text-align:center;font-size:13px;color:#8A5308;background:#FBF0DC;border-radius:10px;padding:8px 14px;margin:0 20px;line-height:1.5}
  #slow a{color:#0F6E56;font-weight:600}
  #line{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#F5F7F4;z-index:10}
  #line a{display:inline-block;background:#0F6E56;color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px;font-size:16px}
  #line img{width:84px;border-radius:20px}
  /* ปุ่มติดตั้งแบบค้างไว้ — โผล่ตลอดจนกว่าจะติดตั้งสำเร็จ */
  #inst{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:8;display:none;
        align-items:center;gap:8px;height:46px;padding:0 18px 0 15px;border:0;border-radius:23px;
        background:#0F6E56;color:#fff;font:inherit;font-size:15px;font-weight:600;
        box-shadow:0 6px 20px rgba(15,110,86,.42);cursor:pointer}
  #inst svg{flex:none}
  #inst:active{transform:scale(.96)}
  #instMsg{position:fixed;left:14px;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:8;display:none;
           background:#fff;border:1px solid #DCE3DE;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;
           box-shadow:0 8px 24px rgba(0,0,0,.14)}
  #instMsg b{color:#0F6E56}

<body>
<div id="load"><img src="icon-192.png" alt=""><div class="spin"></div><div class="t">กำลังเปิด LOG…</div><div id="slow">โหลดนานผิดปกติ — ตรวจสอบสัญญาณอินเทอร์เน็ต หรือ <a id="direct" href="#">เปิดฟอร์มโดยตรง</a></div></div>
<iframe id="app" title="LOG" allow="clipboard-write; fullscreen; web-share" allowfullscreen></iframe>

<div id="instMsg"></div>
<button id="inst" type="button" aria-label="ติดตั้งแอปลงเครื่อง">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
  ติดตั้งแอป
</button>

</div>

<div id="line"><img src="icon-192.png" alt=""><div style="font-size:16px;line-height:1.5">หน้านี้เปิดอยู่ใน LINE<br>กรุณาเปิดใน Chrome/Safari<br>เพื่อติดตั้งเป็นแอปและใช้งานได้ครบ</div><a id="lineOpen" href="#">เปิดใน Chrome / Safari</a></div>

<script>
/* ---- ตั้งค่า: ลิงก์ Apps Script ของฟอร์ม (ลงท้ายด้วย /exec) ---- */
var APP_URL = "https://script.google.com/macros/s/AKfycbxraF-NLS9PT9l9vFMsZ_diVUcd4GGw1ZMfJnGjU5PzN9IFOQIqJDAXjW7pdLXCDLgX/exec";

var q = new URLSearchParams(location.search);
var page = q.get("page") || "form";                 // index.html?page=dash → เปิด Dashboard
var target = APP_URL + "?page=" + encodeURIComponent(page);
var ua = navigator.userAgent || "";
var inLine = /\bLine\//i.test(ua);
var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
/* Samsung Internet ติดตั้งแอปแล้วโดน Google Play Protect บล็อกเสมอ (สร้างด้วยมาตรฐาน Android เก่า)
   จึงต้องพาไปเปิดใน Chrome ให้ด้วยปุ่มเดียว ไม่ต้องให้ผู้ใช้ไปหาเอง */
var isSamsung = /SamsungBrowser/i.test(ua);
var isAndroid = /Android/i.test(ua);
function chromeUrl() {
  var fb = encodeURIComponent("https://play.google.com/store/apps/details?id=com.android.chrome");
  return "intent://" + location.host + location.pathname + location.search +
         "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + fb + ";end";
}

document.getElementById("direct").href = target;

/* เปิดจากใน LINE → ให้ไปเปิดในเบราว์เซอร์จริงก่อน (LINE บล็อกการดาวน์โหลดและติดตั้งแอปไม่ได้) */
if (inLine) {
  var u = new URL(location.href); u.searchParams.set("openExternalBrowser", "1");
  document.getElementById("lineOpen").href = u.toString();
  document.getElementById("line").style.display = "flex";
  document.getElementById("load").style.display = "none";
} else {
  var f = document.getElementById("app");
  var done = false;
  f.addEventListener("load", function () { done = true; var l = document.getElementById("load"); l.style.opacity = "0"; setTimeout(function () { l.style.display = "none"; }, 300); });
  f.src = target;
  setTimeout(function () { if (!done) document.getElementById("slow").style.display = "block"; }, 15000);
}

/* ===== ติดตั้งแอป: ปุ่มเดียว ทางเดียว =====
   - Chrome บน Android  → กดแล้วขึ้นกล่องติดตั้งของระบบทันที
   - Samsung Internet / เบราว์เซอร์อื่นบน Android → กดแล้วเด้งไปเปิดหน้านี้ใน Chrome (Play Protect บล็อกแอปที่สร้างจากเบราว์เซอร์อื่น)
   - iPhone/iPad → กดแล้วบอกวิธี "เพิ่มไปยังหน้าจอโฮม" ใน Safari
   ปุ่มหายเองเมื่อติดตั้งสำเร็จ หรือเมื่อเปิดจากตัวแอปที่ติดตั้งแล้ว */
var deferred = null;
var instBtn = document.getElementById("inst");
var instMsg = document.getElementById("instMsg");
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; });
window.addEventListener("appinstalled", function () { instBtn.style.display = "none"; instMsg.style.display = "none"; });
function showInstBtn() {
  if (standalone || inLine) return;
  if (isSamsung || (isAndroid && !window.chrome)) instBtn.lastChild.textContent = " เปิดใน Chrome เพื่อติดตั้ง";
  instBtn.style.display = "flex";
}
instBtn.onclick = function () {
  if (isSamsung || (isAndroid && !window.chrome)) { location.href = chromeUrl(); return; }
  if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; }); return; }
  instMsg.innerHTML = isIOS
    ? "ใน Safari กดปุ่ม <b>แชร์</b> (สี่เหลี่ยมมีลูกศรขึ้น) → <b>เพิ่มไปยังหน้าจอโฮม</b> → <b>เพิ่ม</b>"
    : "กดเมนู <b>⋮</b> มุมขวาบนของ Chrome → <b>ติดตั้งแอป</b>";
  instMsg.style.display = "block";
};
setTimeout(showInstBtn, 1200);

/* ---- แชร์รูปรายงานแทนฟอร์ม (Web Share ใช้จากใน iframe ของ Apps Script ไม่ได้ หน้าเปลือกชั้นนอกสุดจึงเป็นคนเรียกเมนูแชร์ของเครื่อง) ---- */
var OK_ORIGIN = /(^|\.)(googleusercontent\.com|script\.google\.com)$/;
function canShareFiles() { try { var f = new File([new Uint8Array([137, 80, 78, 71])], "t.png", { type: "image/png" }); return !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch (e) { return false; } }
function b64ToFile(dataUrl, name) { var b = atob(dataUrl.split(",")[1]), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new File([u], name, { type: "image/png" }); }
window.addEventListener("message", function (e) {
  var d = e.data; if (!d || !d.vei1) return;
  var host = ""; try { host = new URL(e.origin).hostname; } catch (x) {}
  if (!OK_ORIGIN.test(host)) return;
  if (d.vei1 === "ping") { e.source.postMessage({ vei1: "canShare", ok: canShareFiles() }, "*"); return; }
  if (d.vei1 === "share" && typeof d.data === "string") {
    var file = b64ToFile(d.data, d.name || "report.png"), src = e.source;
    navigator.share({ files: [file], title: d.name || "VEI1 report" })
      .then(function () { src.postMessage({ vei1: "shared", ok: true }, "*"); })
      .catch(function (err) { src.postMessage({ vei1: "shared", ok: false, error: String(err && err.message || err) }, "*"); });
  }
});

/* Service worker (จำเป็นสำหรับให้ Android เสนอ "ติดตั้งแอป") */
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
