<head>

<title>VEI1 Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="author" content="Vanachai Energy Co., Ltd.">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#F5F7F4;font-family:Sarabun,"Noto Sans Thai",system-ui,sans-serif;color:#17261F;overflow:hidden}
  #app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#F5F7F4}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F5F7F4;transition:opacity .3s}
  #load img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 18px rgba(15,110,86,.3)}
  #load .t{font-size:15px;color:#54655D}
  .spin{width:26px;height:26px;border:3px solid #DCE3DE;border-top-color:#0F6E56;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #slow{display:none;text-align:center;font-size:13px;color:#8A5308;background:#FBF0DC;border-radius:10px;padding:8px 14px;margin:0 20px;line-height:1.5}
  #slow a{color:#0F6E56;font-weight:600}
  #tip{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:#fff;border:1px solid #DCE3DE;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:14px;line-height:1.5;display:none;z-index:9}
  #tip b{color:#0F6E56}
  #tip .row{display:flex;gap:8px;margin-top:8px}
  #tip button{flex:1;height:40px;border-radius:9px;border:1px solid #DCE3DE;background:#fff;font:inherit;font-size:14px}
  #tip button.pri{background:#0F6E56;color:#fff;border-color:#0F6E56;font-weight:600}
  #line{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#F5F7F4;z-index:10}
  #line a{display:inline-block;background:#0F6E56;color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px;font-size:16px}
  #line img{width:84px;border-radius:20px}
</style>
</head>
<body>
<div id="load"><img src="icon-192.png" alt=""><div class="spin"></div><div class="t">กำลังเปิด VEI1 Log…</div><div id="slow">โหลดนานผิดปกติ — ตรวจสอบสัญญาณอินเทอร์เน็ต หรือ <a id="direct" href="#">เปิดฟอร์มโดยตรง</a></div></div>
<iframe id="app" title="VEI1 Log" allow="clipboard-write; fullscreen" allowfullscreen></iframe>

<div id="tip">
  <b>ติดตั้งเป็นแอปบนมือถือ</b><br>
  <span id="tipTxt"></span>
  <div class="row"><button id="tipLater">ไว้ทีหลัง</button><button id="tipInstall" class="pri" style="display:none">ติดตั้ง</button><button id="tipOk" class="pri">เข้าใจแล้ว</button></div>
</div>

<div id="line"><img src="icon-192.png" alt=""><div style="font-size:16px;line-height:1.5">หน้านี้เปิดอยู่ใน LINE<br>กรุณาเปิดใน Chrome/Safari<br>เพื่อติดตั้งเป็นแอปและใช้งานได้ครบ</div><a id="lineOpen" href="#">เปิดใน Chrome / Safari</a></div>

<script>
/* ---- ตั้งค่า: ลิงก์ Apps Script ของฟอร์ม (ลงท้ายด้วย /exec) ---- */
var APP_URL = "https://script.google.com/macros/s/AKfycbxraF-NLS9PT9l9vFMsZ_diVUcd4GGw1ZMfJnGjU5PzN9IFOQIqJDAXjW7pdLXCDLgX/exec";

var q = new URLSearchParams(location.search);
var page = q.get("page") || "form";                 // index.html?page=dash → เปิด Dashboard
var target = APP_URL + "?page=" + encodeURIComponent(page);
var ua = navigator.userAgent || "";
var inLine = /\bLine\//i.test(ua);
var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

document.getElementById("direct").href = target;

/* เปิดจากใน LINE → ให้ไปเปิดในเบราว์เซอร์จริงก่อน (LINE บล็อกการดาวน์โหลดและติดตั้งแอปไม่ได้) */
if (inLine) {
  var u = new URL(location.href); u.searchParams.set("openExternalBrowser", "1");
  document.getElementById("lineOpen").href = u.toString();
  document.getElementById("line").style.display = "flex";
  document.getElementById("load").style.display = "none";
} else {
  var f = document.getElementById("app");
  var done = false;
  f.addEventListener("load", function () { done = true; var l = document.getElementById("load"); l.style.opacity = "0"; setTimeout(function () { l.style.display = "none"; }, 300); });
  f.src = target;
  setTimeout(function () { if (!done) document.getElementById("slow").style.display = "block"; }, 15000);
}

/* คำแนะนำติดตั้ง (แสดงครั้งแรกเมื่อยังไม่ได้ติดตั้ง) */
var deferred = null;
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; var b = document.getElementById("tipInstall"); b.style.display = "block"; document.getElementById("tipOk").style.display = "none"; });
function showTip() {
  if (standalone || inLine) return;
  try { if (localStorage.getItem("vei1.tip") === "no") return; } catch (e) {}
  document.getElementById("tipTxt").innerHTML = isIOS
    ? "ใน Safari กดปุ่ม <b>แชร์</b> (สี่เหลี่ยมมีลูกศรขึ้น) → เลื่อนหา <b>\"เพิ่มไปยังหน้าจอโฮม\"</b> → กด <b>เพิ่ม</b>"
    : "ใน Chrome กดเมนู <b>⋮</b> มุมขวาบน → <b>\"เพิ่มไปยังหน้าจอหลัก\"</b> หรือ <b>\"ติดตั้งแอป\"</b> → กด <b>ติดตั้ง</b>";
  document.getElementById("tip").style.display = "block";
}
document.getElementById("tipLater").onclick = function () { document.getElementById("tip").style.display = "none"; };
document.getElementById("tipOk").onclick = function () { try { localStorage.setItem("vei1.tip", "no"); } catch (e) {} document.getElementById("tip").style.display = "none"; };
document.getElementById("tipInstall").onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; document.getElementById("tip").style.display = "none"; }); };
setTimeout(showTip, 2500);

/* Service worker (จำเป็นสำหรับให้ Android เสนอ "ติดตั้งแอป") */
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
